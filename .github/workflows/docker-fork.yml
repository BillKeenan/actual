name: Build Fork Docker Image

# Builds the sync-server image from this fork and pushes it to ghcr.io.
on:
  push:
    branches:
      - master
      - import-account-matching
  workflow_dispatch:

concurrency:
  group: docker-fork-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build and push Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/actual-server
          tags: |
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Built outside the Dockerfile, same as upstream (faster, avoids yarn memory issues)
      - name: Set up environment
        uses: ./.github/actions/setup
        with:
          cache: 'false'

      - name: Build Web
        run: yarn build:server

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          file: packages/sync-server/docker/ubuntu.Dockerfile
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
